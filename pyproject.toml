# Инструменты разработки. Сборка пакета отсюда не делается: проект
# разворачивается образом (см. Dockerfile), а не устанавливается как
# библиотека, поэтому секции [project] и [build-system] здесь нет.

[tool.ruff]
# 88, а не 79: в коде уже есть полторы сотни строк длиннее 79 — в основном
# цепочки queryset и длинные reverse(). Ломать их ради нормы значит
# ухудшить чтение. Длиннее 88 всего восемь строк, их и поправим.
line-length = 88
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: неиспользуемые имена, опечатки в переменных
    "I",        # isort: порядок импортов
    "UP",       # pyupgrade: устаревшие конструкции
    "B",        # bugbear: типовые ловушки
    "C4",       # лишние comprehension
    "DJ",       # правила для Django
    "RUF",      # правила самого ruff, включая кириллицу в идентификаторах
]
ignore = [
    # Длинные строки в комментариях и docstring: пояснения в этом проекте
    # написаны прозой, и рвать фразу ради колонки незачем — E501 ловит
    # заодно и их. Код всё равно проверяется по line-length при форматировании.
    "E501",
    # blank=True без null=True у текстовых полей: в неуправляемых таблицах
    # колонки допускают NULL, и модель это повторяет, а не решает заново.
    "DJ001",
    # __str__ есть у всех моделей, где он нужен; у абстрактных — незачем
    "DJ008",
]

[tool.ruff.lint.per-file-ignores]
# Настройки читаются как плоский список имён, часть задаётся условно
"config/settings.py" = ["F401"]
# В тестах длинные литералы разбирать на части не нужно
"*/tests.py" = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["components", "boards", "servers", "config"]

[tool.ruff.format]
# Кавычки в проекте двойные, отступ 4 пробела — это и так умолчания ruff;
# записано явно, чтобы смена умолчаний не переформатировала весь код разом.
quote-style = "double"
indent-style = "space"
